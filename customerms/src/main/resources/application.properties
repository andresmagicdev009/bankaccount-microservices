spring.application.name=customerms

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/customers_ms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description="Initial schema"




#Configuracion para saber si nos estamos conectando a mysql 
management.endpoints.web.exposure.include=health, info
management.endpoint.health.show-details=always
management.health.db.enabled=true

# WebFlux base path (the /api/v1 prefix from the OpenAPI servers block)
spring.webflux.base-path=/api/v1

# Server port declared in the OpenAPI contract
server.port=8081

# HikariCP pool - must match the jdbcScheduler thread count (SchedulerConfig)
spring.datasource.hikari.maximum-pool-size=10
